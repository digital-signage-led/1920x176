<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>STB スクロール診断 1920×176</title>
<!--
  STBの描画性能を切り分けるための最小テストページ（本番表示ではない）。
  文字を 1px/フレームで流すだけ。右側に計測結果を常時表示する。
  URLパラメータ:
    ?step=2   2px/フレームで流す
    ?meter=0  計測表示を消して流れだけを見る
    ?reset=1  溜まった累計を消して計測し直す
  累計はページを読み込み直しても引き継ぐ（プレイヤーが30秒ごとに切り替えても溜まっていく）
  計測表示: 遅れA=21〜30ms(1コマ遅れ) B=30〜50ms C=50ms以上(固まり) の割合
-->
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 176px; overflow: hidden; background: #308DD8; }
  #track {
    position: absolute; top: 0; left: 0; height: 176px;
    display: flex; align-items: center; white-space: nowrap;
    font: 900 96px/1 "Noto Sans JP", sans-serif; color: #fff;
    will-change: transform;
  }
  #track span { padding-right: 160px; }
  #meter {
    position: absolute; top: 0; left: 0; z-index: 2; height: 176px; box-sizing: border-box;
    background: #000; color: #fff;
    font: 700 30px/1.4 sans-serif; padding: 4px 16px; white-space: pre;
  }
  #meter b { color: #7dffa3; }
  #meter i { color: #ffd34d; font-style: normal; }
</style>
</head>
<body>
<div id="track"></div>
<div id="meter">計測中…</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var STEP = Math.max(1, parseInt(q.get('step') || '1', 10));
  var SHOW = q.get('meter') !== '0';
  var track = document.getElementById('track');
  var meter = document.getElementById('meter');
  if (!SHOW) meter.style.display = 'none';
  var unit = '<span>スクロール診断 1234567890 天気・防災情報</span>';
  var html = '';
  for (var i = 0; i < 4; i++) html += unit;
  track.innerHTML = html;
  var unitW = track.firstChild.getBoundingClientRect().width;

  var WIN_MS = 10000;
  /* フレーム間隔の分布: 〜12ms / 12〜21ms(正常) / 21〜30ms / 30〜50ms / 50ms〜 */
  function newStats() { return { frames: 0, drops: 0, worst: 0, b: [0, 0, 0, 0, 0], t0: 0 }; }
  var win = newStats(), total = newStats(), lastWin = null;
  /* 累計の引き継ぎ（localStorage）。使えない環境ではこの回の分だけ数える */
  var KEY = 'scrollTest.total.v1';
  var saved = { frames: 0, drops: 0, worst: 0, b: [0, 0, 0, 0, 0], ms: 0, runs: 0 };
  try {
    if (q.get('reset') === '1') localStorage.removeItem(KEY);
    var raw = localStorage.getItem(KEY);
    if (raw) { var o = JSON.parse(raw); if (o && o.b && o.b.length === 5) saved = o; }
  } catch (e) {}
  saved.runs = (saved.runs || 0) + 1;
  function merged(runMs) {
    return {
      frames: saved.frames + total.frames,
      drops: saved.drops + total.drops,
      worst: Math.max(saved.worst, total.worst),
      b: saved.b.map(function (v, i) { return v + total.b[i]; }),
      ms: saved.ms + runMs
    };
  }
  function persist(runMs) {
    try { var m = merged(runMs); m.runs = saved.runs; localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) {}
  }
  var x = 0, last = 0, startTs = 0;
  var ua = navigator.userAgent.match(/Chrome\/[\d.]+/);
  var envLine = innerWidth + '×' + innerHeight + ' ' + (ua ? ua[0].replace('Chrome/', 'C') : '');

  function add(s, dt) {
    s.frames++;
    if (dt > s.worst) s.worst = dt;
    if (dt > 25) s.drops++;
    s.b[dt < 12 ? 0 : dt < 21 ? 1 : dt < 30 ? 2 : dt < 50 ? 3 : 4]++;
  }
  function pct(n, d) { return d ? (n * 100 / d).toFixed(1) + '%' : '-'; }
  function render(ts) {
    var lines = [];
    var all = merged(ts - startTs);
    var sec = (all.ms / 1000) | 0;
    if (lastWin) {
      var fps = lastWin.frames * 1000 / WIN_MS;
      lines.push('<b>10秒</b> FPS ' + fps.toFixed(1) + ' 落ち<i>' + lastWin.drops + '</i> 最大' + lastWin.worst.toFixed(0) + 'ms');
    } else {
      lines.push('<b>10秒</b> 集計中…');
    }
    var tf = all.frames;
    lines.push('<b>累計' + sec + '秒/' + saved.runs + '回目</b> 落ち<i>' + all.drops + '</i> 最大' + all.worst.toFixed(0) + 'ms');
    lines.push('遅れ <i>A</i>' + pct(all.b[2], tf) + ' <i>B</i>' + pct(all.b[3], tf) + ' <i>C</i>' + pct(all.b[4], tf));
    lines.push(envLine);
    meter.innerHTML = lines.join('\n');
  }

  var lastRender = 0;
  function step(ts) {
    if (!startTs) { startTs = ts; win.t0 = ts; }
    if (last) {
      var dt = ts - last;
      add(win, dt);
      add(total, dt);
    }
    last = ts;
    x -= STEP;
    if (x <= -unitW) x += unitW;
    track.style.transform = 'translate3d(' + x + 'px,0,0)';
    if (ts - win.t0 >= WIN_MS) { lastWin = win; win = newStats(); win.t0 = ts; }
    if (ts - lastRender >= 1000) { lastRender = ts; persist(ts - startTs); if (SHOW) render(ts); }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
