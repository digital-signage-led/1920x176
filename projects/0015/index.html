    if (vp) {
        vp.setAttribute('content', 'width=1920, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
    }
    function applyRoot_() {
        var root = document.documentElement;
        root.classList.add('native-1920');
        root.classList.add('player-fit');
        root.classList.add('no-logo-panel');
        root.classList.remove('browser-preview');
        if (!forceNative) {
            root.classList.add('browser-preview');

        }
    }
    applyRoot_();
    function addBody_() {
        if (!document.body) return;
        document.body.classList.remove('layout-512');
        document.documentElement.classList.remove('layout-512');
        document.body.classList.add('native-1920');
        document.body.classList.add('player-fit');
        document.body.classList.add('no-logo-panel');
        document.body.classList.remove('browser-preview');
        if (!forceNative) {
            document.body.classList.add('browser-preview');
            document.body.classList.remove('native-1920');
        }
        fitToPlayer_();
    }
    function viewSize_() {
        var vv = window.visualViewport;
        var vw = Math.max(1, (vv && vv.width) || window.innerWidth || STAGE_W);
        var vh = Math.max(1, (vv && vv.height) || window.innerHeight || STAGE_H);
        return { vw: vw, vh: vh };
    }
    /** 原点(0,0)。拡大はしない。縮小時はシェルサイズも合わせて下帯欠けを防ぐ */
    function fitToPlayer_() {
        var shell = document.querySelector('.stage-shell');
        var canvas = document.querySelector('.canvas');
        if (!canvas) return;
        if (!shell) {
            shell = document.createElement('div');
            shell.className = 'stage-shell';
            canvas.parentNode.insertBefore(shell, canvas);
            shell.appendChild(canvas);
        }
        var sz = viewSize_();
        var vw = sz.vw;
        var vh = sz.vh;
        var s = Math.min(vw / STAGE_W, vh / STAGE_H, 1);
        if (!(s > 0) || !isFinite(s)) s = 1;
        var outW = Math.round(STAGE_W * s);
        var outH = Math.round(STAGE_H * s);
        shell.style.cssText = [
            'position:absolute',
            'left:0',
            'top:0',
            'width:' + outW + 'px',
            'height:' + outH + 'px',
            'margin:0',
            'padding:0',
            'overflow:hidden',
            'transform-origin:0 0',
            'z-index:1'
        ].join(';');
        canvas.style.transformOrigin = '0 0';
        canvas.style.position = 'absolute';
        canvas.style.left = '0';
        canvas.style.top = '0';
        canvas.style.right = 'auto';
        canvas.style.bottom = 'auto';
        canvas.style.width = STAGE_W + 'px';
        canvas.style.height = STAGE_H + 'px';
        canvas.style.margin = '0';
        canvas.style.padding = '0';
        canvas.style.zoom = '1';
        canvas.style.transform = (s === 1) ? 'none' : ('scale(' + s + ')');
        document.documentElement.style.width = vw + 'px';
        document.documentElement.style.height = vh + 'px';
        if (document.body) {
            document.body.style.width = vw + 'px';
            document.body.style.height = vh + 'px';
            document.body.style.margin = '0';
            document.body.style.padding = '0';
            document.body.style.overflow = 'hidden';
        }
    }
    window.fitSignagePreview_ = fitToPlayer_;
    window.fitToPlayer_ = fitToPlayer_;
    window.SIGNAGE_STAGE = { w: STAGE_W, h: STAGE_H, contentW: CONTENT_W, faceW: 128, faceH: 176, faces: 15, contentFaces: 15 };
    window.addEventListener('resize', fitToPlayer_);
    window.addEventListener('orientationchange', function () { setTimeout(fitToPlayer_, 50); });
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', fitToPlayer_);
        window.visualViewport.addEventListener('scroll', fitToPlayer_);
    }
    if (document.body) addBody_();
    else document.addEventListener('DOMContentLoaded', addBody_);
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fitToPlayer_);
    } else {
        fitToPlayer_();
    }
    setTimeout(fitToPlayer_, 0);
    setTimeout(fitToPlayer_, 100);
    setTimeout(fitToPlayer_, 500);
})();

    function loadCss() {
        css.forEach(function (href) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href;
            document.head.appendChild(link);
        });
    }
    function loadJs(i) {
        if (i >= js.length) return;
        var s = document.createElement('script');
        s.src = js[i];
        s.onload = s.onerror = function () { loadJs(i + 1); };
        document.body.appendChild(s);
    }
    function mountExtra(text) {
        var holder = document.createElement('div');
        holder.innerHTML = text;
        var area = document.querySelector('.content-area');
        var scene2 = document.getElementById('scene2');
        var canvas = document.querySelector('.canvas');
        var beforeEl = holder.querySelector('#signage-before');
        var afterEl = holder.querySelector('#signage-after');
        var logoEl = holder.querySelector('.logo-panel');
        if (area && scene2 && beforeEl) {
            while (beforeEl.firstChild) area.insertBefore(beforeEl.firstChild, scene2);
        }
        if (area && afterEl) {
            while (afterEl.firstChild) area.appendChild(afterEl.firstChild);
        }
        if (canvas && logoEl) canvas.appendChild(logoEl);
    }
    function start() {
        fetch('./assets/signage-extra.html?v=20261112f')
            .then(function (res) { return res.ok ? res.text() : ''; })
            .then(function (text) { if (text) mountExtra(text); })
            .catch(function () {})
            .then(function () { loadCss(); loadJs(0); });
    }
    if (document.readyState === 'complete') start();
    else window.addEventListener('load', start);
})();
</script>
